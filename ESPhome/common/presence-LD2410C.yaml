logger:
  hardware_uart: USB_SERIAL_JTAG

uart:
  id: uart_ld2410
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 256000

ld2410:
  id: ld2410_radar
  uart_id: uart_ld2410

switch:
  - platform: ld2410
    ld2410_id: ld2410_radar
    bluetooth:
      name: "Bluetooth"
      restore_mode: ALWAYS_OFF
      entity_category: "config"

binary_sensor:
  - platform: ld2410
    ld2410_id: ld2410_radar
    has_target:
      name: None