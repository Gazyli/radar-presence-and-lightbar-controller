esphome:
  includes:
    - ../common/radar_math.h

logger:
  hardware_uart: USB_SERIAL_JTAG

uart:
  id: uart_ld2450
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 256000

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

number:
  - platform: template
    name: "Radar Mount Angle"
    id: radar_angle
    min_value: -180
    max_value: 180
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    unit_of_measurement: "°"
    entity_category: "config"

  - platform: template
    name: "X Axis Offset"
    id: x_offset
    min_value: 0
    max_value: 615
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    unit_of_measurement: "cm"
    entity_category: "config"

  - platform: template
    name: "Y Axis Offset"
    id: y_offset
    min_value: 0
    max_value: 550
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    unit_of_measurement: "cm"
    entity_category: "config"

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: None

sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Presence Target Count"
    target_1:
      x:
        id: target_1_x
        internal: true
      y:
        id: target_1_y
        internal: true
    target_2:
      x:
        id: target_2_x
        internal: true
      y:
        id: target_2_y
        internal: true
    target_3:
      x:
        id: target_3_x
        internal: true
      y:
        id: target_3_y
        internal: true

  - platform: template
    name: "Target 1 Global X"
    id: target_1_global_x
    entity_category: "diagnostic"
    unit_of_measurement: "cm"
    update_interval: 1s
    filters:
      - exponential_moving_average:
          alpha: 0.3
    lambda: |-
      return radar_math::get_global_x(
        id(target_1_x).state, 
        id(target_1_y).state, 
        id(radar_angle).state, 
        id(x_offset).state
      );
    
  - platform: template
    name: "Target 1 Global Y"
    id: target_1_global_y
    entity_category: "diagnostic"
    unit_of_measurement: "cm"
    update_interval: 1s
    filters:
      - exponential_moving_average:
          alpha: 0.3
    lambda: |-
      return radar_math::get_global_y(
        id(target_1_x).state, 
        id(target_1_y).state, 
        id(radar_angle).state, 
        id(y_offset).state
      );

  - platform: template
    name: "Target 2 Global X"
