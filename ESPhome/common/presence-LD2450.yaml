logger:
  hardware_uart: USB_SERIAL_JTAG

uart:
  id: uart_ld2450
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 256000

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

number:
  - platform: template
    name: "Radar Mount Angle"
    id: radar_angle
    min_value: -180
    max_value: 180
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    unit_of_measurement: "°"
    entity_category: "config"

  - platform: template
    name: "X Axis Offset"
    id: x_offset
    min_value: 0
    max_value: 615
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    unit_of_measurement: "cm"
    entity_category: "config"

  - platform: template
    name: "Y Axis Offset"
    id: y_offset
    min_value: 0
    max_value: 550
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    unit_of_measurement: "cm"
    entity_category: "config"

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: None

sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Presence Target Count"
    target_1:
      x:
        id: target_1_x
        internal: true
      y:
        id: target_1_y
        internal: true
    target_2:
      x:
        id: target_2_x
        internal: true
      y:
        id: target_2_y
        internal: true
    target_3:
      x:
        id: target_3_x
        internal: true
      y:
        id: target_3_y
        internal: true

packages:
  # Target global coordinate templates
  target_template: !include
    file: ../common/target-template.yaml
    vars:
      target_num: "1"
  target_2_template: !include
    file: ../common/target-template.yaml
    vars:
      target_num: "2"
  target_3_template: !include
    file: ../common/target-template.yaml
    vars:
      target_num: "3"
  # Zone templates
  zone_1: !include
    file: ../common/zone-template.yaml
    vars:
      zone_num: "1"
  zone_2: !include
    file: ../common/zone-template.yaml
    vars:
      zone_num: "2"
  zone_3: !include
    file: ../common/zone-template.yaml
    vars:
      zone_num: "3"
