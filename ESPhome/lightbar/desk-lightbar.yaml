esphome:
  name: desk-lightbar
  friendly_name: "Desk Lightbar"
  area: "Desk"

substitutions:
  # Lightbar
  cold_white_pin: "GPIO7"
  warm_white_pin: "GPIO8"
  # Atmospheric
  i2c_sda_pin: "GPIO0"
  i2c_scl_pin: "GPIO1"

packages:
  common_esp32c3_setup: !include ../common/esp32c3-base.yaml
  common_diagnostics: !include ../common/diagnostics.yaml
  common_lightbar: !include ../common/lightbar.yaml
  common_illuminance: !include ../common/bh1750.yaml
