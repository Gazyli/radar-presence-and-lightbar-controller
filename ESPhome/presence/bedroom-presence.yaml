esphome:
  name: bedroom-presence
  friendly_name: "Bedroom Presence"
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5db

# ==================================
# Hardware Buses
# ==================================
uart:
  id: uart_ld2450
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 256000

i2c:
  id: i2c_bus
  sda: GPIO9
  scl: GPIO8
  scan: true

# ==================================
# LD2450 Radar Hub
# ==================================
ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

# ==================================
# Binary Sensors
# ==================================
binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: "Presence"

# ==================================
# Sensors
# ==================================
sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  
  - platform: uptime
    type: seconds
    name: "Uptime Sensor"

  # LD2450 Tracking Metrics
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Presence Target Count"
    target_1:
      x:
        name: "Target 1 X"
      y:
        name: "Target 1 Y"
      distance:
        name: "Target 1 Distance"
    target_2:
      x:
        name: "Target 2 X"
      y:
        name: "Target 2 Y"
      distance:
        name: "Target 2 Distance"
    target_3:
      x:
        name: "Target 3 X"
      y:
        name: "Target 3 Y"
      distance:
        name: "Target 3 Distance"

  # BH1750 Light Sensor
  - platform: bh1750
    name: "Illuminance"
    address: 0x23
    update_interval: 60s

  # AHT20 Temperature & Humidity Sensor
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 60s

  # BMP280 Temperature & Pressure Sensor
  - platform: bmp280_i2c
    address: 0x77
    temperature:
      name: "Temperature (BMP280)"
      entity_category: diagnostic
    pressure:
      name: "Pressure"
    update_interval: 60s